name: withBTS.kz news agent

on:
  # Started every 30 minutes by the "Heartbeat" workflow (GitHub's own timer skips runs).
  workflow_dispatch: {}   # "Run workflow" button for manual runs

concurrency:
  group: news-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Account keys are given only to the steps that need them (collect and publish),
    # never to the Claude step that writes the texts.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and fonts
        run: |
          pip install -r requirements.txt
          mkdir -p media queue state && touch media/.gitkeep queue/.gitkeep
          (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q fonts-noto-core ffmpeg >/dev/null) || true

      - name: Check kill switch
        id: switch
        run: |
          if grep -qE '^enabled:\s*false' config/settings.yaml; then
            echo "on=false" >> "$GITHUB_OUTPUT"; echo "Kill switch is off, stopping."
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect news
        if: steps.switch.outputs.on == 'true'
        id: collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python scripts/collect.py
          python scripts/gate.py   # filters, schedules and picks the model; writes count and model

      - name: Write posts in Kazakh (Claude Code)
        id: writer
        if: steps.switch.outputs.on == 'true' && steps.collect.outputs.count != '0'
        # if the writer runs out of steps, still design and publish the posts it already wrote
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude Pro subscription (token from "claude setup-token").
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # To pay per use with an API key instead, delete the line above and use:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The Heartbeat workflow (a GitHub bot) starts this run every 30 minutes.
          allowed_bots: "github-actions"
          prompt: "Read prompts/run.md and follow it exactly."
          claude_args: |
            --model ${{ steps.collect.outputs.model }}
            --max-turns 25
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Design Instagram cards
        if: steps.switch.outputs.on == 'true'
        run: python scripts/render_card.py

      - name: Save cards (so Instagram and Threads can load them)
        if: steps.switch.outputs.on == 'true'
        run: |
          git config user.name "withbts-news-agent"
          git config user.email "actions@users.noreply.github.com"
          git add media queue state
          git diff --cached --quiet || (git commit -q -m "Cards $(date -u +%F_%H%M)" && (for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done))

      - name: Publish
        if: steps.switch.outputs.on == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/publish.py

      - name: Finish and save state
        if: always() && steps.switch.outputs.on == 'true'
        env:
          WRITER_OUTCOME: ${{ steps.writer.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          python scripts/finalize.py
          git add -A media queue state
          git diff --cached --quiet || (git commit -q -m "Run $(date -u +%F_%H%M)" && (for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done))
