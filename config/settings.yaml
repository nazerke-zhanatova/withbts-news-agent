# withBTS.kz news agent settings
# Edit this file on GitHub (pencil icon) to change behaviour. Changes apply on the next run.

# KILL SWITCH. Set to false to stop all publishing immediately.
enabled: true

# Dry run: true = the agent does everything except actually posting (good for the first test).
dry_run: true

# Approval mode: true = new posts wait in state/pending until Nazerke approves them
# ("ready, go"), then the "Publish approved posts" workflow posts them. false = posts go out automatically.
approval_mode: true

# Where to publish. Turn each platform on once its keys are added in GitHub Secrets.
platforms:
  telegram: true
  instagram: true
  threads: true
  x: false

# Maximum new posts per run (the schedule runs every 3 hours).
max_posts_per_run: 3

# Script for Kazakh text: "cyrillic" or "latin"
kazakh_script: cyrillic

# Credits line added right under the post text. {credits} is replaced with the source account names.
# The "@" is always removed so no wrong account gets tagged.
credits_template: "credits: {credits}"

# Hashtags added to every post (platform rules below decide how many are used).
hashtags:
  instagram: ["#BTS", "#방탄소년단", "#withBTSkz", "#BTSKazakhstan", "#ARMY"]
  threads: ["#BTS", "#withBTSkz"]
  x: ["#BTS", "#방탄소년단"]
  telegram: ["#BTS", "#withBTSkz"]

# Instagram card design (1080x1350), withBTS.kz brand.
design:
  background: "#CCAAFF"     # withBTS.kz lavender
  highlight: "#FFC91D"      # yellow for highlights (tag label, accents)
  text: "#111111"
  muted: "#2B1A45"
  brand_name: "withBTS.kz"
  logo_file: "templates/logo_heart.png"        # heart logo
  wordmark_file: "templates/logo_wordmark.png" # "withBTS.kz KAZAKHSTAN FANBASE"

# Meta Graph API version used for Instagram. Update if Meta deprecates it.
graph_api_version: "v23.0"

# GitHub repo in "owner/name" form. Needed so Instagram and Threads can load the card image.
# Leave empty: the workflow fills it automatically from GITHUB_REPOSITORY.
public_repo: ""

# Photos the agent finds on the internet (CLAUDE.md rule 5d) are downloaded only from these sites.
photo_domains:
  - image.koreajoongangdaily.com
  - newsimg.koreatimes.co.kr
  - img.yna.co.kr
  - pbs.twimg.com
  - telesco.pe
  - phinf.wevpstatic.net
  - weverse.io
  - ibighit.com
  - hybecorp.com
  - soompi.io

# Last-resort group photo (all 7 members, official BIGHIT MUSIC, ARIRANG tour, Sao Paulo, Oct 2026).
fallback_group_photo:
  url: "https://image.koreajoongangdaily.com/12949651.jpg?imageId=12949651&width=1600"
  credit: "BIGHIT MUSIC"
