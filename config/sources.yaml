# Where the agent looks for news.
#
# Tiers decide what the agent is allowed to do:
#   official         = can be posted directly
#   trusted_fanbase  = can be posted directly, credits always required
#   news_media       = NEVER posted on its own, only used to confirm official news
#
# role: translation = this account translates posts from the members or official accounts.
#   Never make a separate post from it if the original news is also in this run or already posted.
#   Use it only to understand the Korean original better, and credit both accounts.
#
# role: aggregator = an account that posts many small news items. All its new items in one run
#   are grouped into ONE digest post, without news that is already posted or covered by another source.
#
# filter = only items that mention one of these words are used (for accounts that post about many artists).
# limit = how many latest posts to read per run (default 8).

instagram:
  # Read through the Instagram Business Discovery API. This only works for public
  # Business or Creator accounts; for other accounts the log shows an error and they are skipped.
  # NOTE: reading other accounts needs Meta App Review (Advanced Access). Until then these
  # show "(#10) Application does not have permission" in the log and are skipped.
  - handle: bts.bighitofficial
    tier: official
  # Member accounts
  - handle: rkive          # RM
    tier: official
  - handle: jin            # Jin
    tier: official
  - handle: agustd         # SUGA
    tier: official
  - handle: uarmyhope      # j-hope
    tier: official
  - handle: j.m            # Jimin
    tier: official
  - handle: thv            # V
    tier: official
  - handle: mnijungkook    # Jung Kook
    tier: official
  # Trusted fanbases
  - handle: btsnewsru      # Russian-language BTS news, posts a lot
    tier: trusted_fanbase
    role: aggregator       # its news is grouped into one digest post per run
    limit: 25              # read up to 25 latest posts per run

telegram:
  # Public Telegram channels, read from the public web preview (t.me/s/<name>).
  - handle: btsnewsru0     # Russian-language BTS news channel, posts a lot
    tier: trusted_fanbase
    role: aggregator       # its news is grouped into one digest post per run
  # Add more trusted channels like this:
  # - handle: example_channel
  #   tier: trusted_fanbase

rss:
  # Reliable news outlets, through Google News (last 24 hours). The agent only posts news that
  # 2 different reliable outlets report (CLAUDE.md rule 1), and never posts the same news twice.
  - name: Google News EN
    url: "https://news.google.com/rss/search?q=BTS+(BIGHIT+OR+HYBE+OR+ARIRANG+OR+Weverse+OR+RM+OR+Jin+OR+SUGA+OR+j-hope+OR+Jimin+OR+Jungkook)+when:1d&hl=en-US&gl=US&ceid=US:en"
    tier: news_media
    filter: ["BTS"]
  # Korean Google News feed turned off to save Claude usage (mostly photo galleries and rankings).

x:
  # Reading X needs a paid X API plan (X_BEARER_TOKEN). Turn on once you have it.
  enabled: false
  accounts:
    - handle: BTS_twt          # members post here directly
      tier: official
    - handle: bts_bighit       # run by BIGHIT MUSIC
      tier: official
    - handle: HYBEOFFICIALtwt  # HYBE, posts about many artists
      tier: official
      filter: ["BTS", "방탄소년단", "RM", "Jin", "SUGA", "j-hope", "Jimin", "Jung Kook", "Jungkook"]
    - handle: BTS_Trans        # English translations of BTS posts
      tier: trusted_fanbase
      role: translation
    - handle: btschartsxdaily  # charts and records
      tier: trusted_fanbase

# Not collectable automatically (no public API for reading these):
#   TikTok bts_official_bighit
#   Weverse
# News from them reaches the agent through the accounts above that repost it.
